<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Ori Solomon logo">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset=".45" stop-color="#a9a9a9"/>
      <stop offset=".6" stop-color="#e8e8e8"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <radialGradient id="ring" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#d9d6cf"/><stop offset="1" stop-color="#eeebe4"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d49a"/><stop offset=".5" stop-color="#c6a35a"/>
      <stop offset="1" stop-color="#9c7a36"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2a8"/><stop offset="1" stop-color="#b8913f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="url(#goldStroke)" stroke="#5a4214" stroke-width=".6"/>
    </marker>
  </defs>

  <!-- coin -->
  <circle cx="200" cy="200" r="185" fill="url(#silver)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="174" fill="url(#ring)"/>
  <g fill="#9a978f">
    <path d="M200 32 l-6 12 h12z"/><path d="M200 368 l-6 -12 h12z"/>
    <path d="M32 200 l12 -6 v12z"/><path d="M368 200 l-12 -6 v12z"/>
  </g>
  <circle cx="200" cy="200" r="148" fill="url(#gold)" stroke="#8d6d2c" stroke-width="2"/>

  <!-- UX mark -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <g stroke="#5a4214" stroke-width="26">
      <path d="M120 120 V215 A50 50 0 0 0 220 215 V112"/>
      <path d="M235 285 L300 140"/>
      <path d="M245 165 L305 285"/>
    </g>
    <g stroke="url(#goldStroke)" stroke-width="20">
      <path d="M120 120 V215 A50 50 0 0 0 220 215 V112" marker-end="url(#head)"/>
      <path d="M235 285 L300 140" marker-end="url(#head)"/>
      <path d="M245 165 L305 285"/>
    </g>
  </g>

  <!-- name -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="900" text-anchor="middle"
     fill="#3a2410" stroke="#f1e2b0" stroke-width="1.2" paint-order="stroke">
    <text x="200" y="192" font-size="44">ORI</text>
    <text x="200" y="240" font-size="40" letter-spacing="1">SOLOMON</text>
  </g>
</svg>
